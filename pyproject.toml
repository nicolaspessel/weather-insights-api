[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[project]
name = "weather-insights-api"
version = "0.4.0"
description = "API that transforms weather data from Open-Meteo."
requires-python = ">=3.12"

dependencies = [
    "fastapi",
    "requests",
    "uvicorn",
]


[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "httpx",
]


[tool.setuptools.packages.find]
where = ["src"]
